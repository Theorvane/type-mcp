name: Enforce reviewer-managed PR labels

on:
  pull_request_target:
    branches: [dev, main]
    types: [opened, labeled]

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-unreviewed-labels:
    if: >-
      github.event.sender.login != 'sjungwon03-ai'
    runs-on: ubuntu-latest
    steps:
      - name: Remove labels set by a non-reviewer
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { action, label, pull_request: pullRequest } = context.payload;
            const issueNumber = pullRequest.number;

            const removeLabel = async (name) => {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name,
                });
              } catch (error) {
                if (
                  typeof error === 'object' &&
                  error !== null &&
                  'status' in error &&
                  error.status === 404
                ) {
                  core.info(`Label ${name} was already absent.`);
                  return;
                }

                throw error;
              }
            };

            if (action === 'labeled') {
              await removeLabel(label.name);
              core.info(`Removed unauthorized label ${label.name}.`);
              return;
            }

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            await Promise.all(
              labels.map(({ name }) =>
                removeLabel(name),
              ),
            );
            core.info(`Removed ${labels.length} unreviewed label(s).`);
